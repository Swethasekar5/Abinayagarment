# Builds the Astro site and publishes it to GitHub Pages.
# One-time setup (repo admin): Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

# Manual only (Actions tab → Run workflow). The site is currently hosted on Cloudflare
# (see wrangler.jsonc); re-enable the push trigger below if you switch back to GitHub Pages.
on:
  workflow_dispatch:
  # push:
  #   branches: [develop, master]

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; don't cancel a run that's already publishing
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
